<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}
body{width:1280px;height:640px;background:#1a1a1c;color:#f2f1ec;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased;padding:0 96px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
.lock{height:76px;width:auto;align-self:flex-start;display:block;margin-left:-22px}
h1{font-size:66px;line-height:1.08;font-weight:700;letter-spacing:-1.6px;margin-top:48px;max-width:1000px}
h1 span{color:#a3a3ab}
.flow{display:flex;align-items:center;gap:18px;margin-top:56px}
.pill{display:flex;align-items:center;gap:12px;border:1.5px solid #ffffff26;border-radius:14px;padding:14px 22px;font-size:26px;font-weight:600;background:#ffffff08}
.pill svg{width:26px;height:26px}
.arrow{color:#6b6b73;font-size:28px}
.pill.pr{border-color:#22c55e80}.pill.pr svg{color:#22c55e}
</style></head><body>
<img class="lock" src="serra-lockup.png">
<h1>The coding agents on your Mac,<br><span>in Slack.</span></h1>
<div class="flow">
 <div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></svg>A message</div>
 <div class="arrow">→</div>
 <div class="pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></svg>A T3 task in its own worktree</div>
 <div class="arrow">→</div>

</div>
</body></html>
